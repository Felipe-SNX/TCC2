services:

  # ============================================================
  # 🗄️  BANCO DE DADOS — MySQL
  # ============================================================
  db:
    image: mysql:8.0
    container_name: tcc_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tcc_db
    ports:
      - "3306:3306"
    # 💾 VOLUME: os dados ficam salvos aqui mesmo após desligar o Docker
    volumes:
      - tcc_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================================
  # 👨‍🍳  BACKEND — FastAPI
  # ============================================================
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: tcc_back
    restart: unless-stopped
    # O backend SÓ sobe depois que o banco estiver saudável (healthcheck ok)
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://root:root@db:3306/tcc_db
    ports:
      - "8000:8000"
    # Roda as migrations do Alembic automaticamente antes de subir a API
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ============================================================
  # 🍔  FRONTEND — Nuxt
  # ============================================================
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: tcc_front
    restart: unless-stopped
    # O frontend sobe depois que o backend estiver pronto
    depends_on:
      - back
    environment:
      NUXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

# ============================================================
# 💾  VOLUMES — Onde os dados do MySQL ficam salvos no seu PC
# ============================================================
volumes:
  tcc_mysql_data:
    driver: local
